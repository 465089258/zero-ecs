<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071012" />
    <title>Zero ECS · 飞剑基础设施示例</title>
</head>
<body>
    <main class="shell">
        <header>
            <div>
                <p class="eyebrow">ZERO ECS / FLYING SWORD</p>
                <h1>剑阵 · 周天试演</h1>
            </div>
            <div class="legend">
                <span>鼠标左键：角色移动</span>
                <span>鼠标右键：飞剑集火</span>
                <span>空格：环绕</span>
                <span>R：召回</span>
            </div>
        </header>
        <section class="stage">
            <canvas id="scene" aria-label="飞剑三维投影示例"></canvas>
            <aside>
                <p class="label">运行状态</p>
                <pre id="status">正在初始化……</pre>
                <p class="note">
                    数据层：X 左右 / Y 高度 / Z 前后<br />
                    相机：角色后上方跟随 / 水平偏角 45° / 俯角 50°<br />
                    集火：抵达目标后自动归剑并恢复环绕<br />
                    压测：地址追加 ?swords=500
                </p>
            </aside>
        </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
